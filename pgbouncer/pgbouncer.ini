[databases]
; Wildcard: any DB name the client requests is forwarded to postgres:5432
; with the same DB name. Essential for dynamic tenant databases — new tenants
; are created at runtime and PgBouncer must not require a restart.
* = host=postgres port=5432

[pgbouncer]
;; Network
listen_addr = 0.0.0.0
listen_port = 6432

;; Auth — plain text is safe for local dev (Docker internal network only).
;; Production uses auth_type = md5 (see lotusbook/.devpro/pgbouncer/).
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

;; Pooling mode — MUST be session. Reasons:
;; 1. Laravel sends SET search_path on every new PDO connection.
;;    In transaction mode this state is not guaranteed on the next borrow.
;; 2. DB::purge()/DB::reconnect() per-request requires session-level state
;;    to be reset cleanly on reconnect.
;; 3. lockForUpdate() in stock/COA repositories requires session semantics.
pool_mode = session

;; Pool sizes
; Server connections per database+user pair.
; 10 is generous for ERP traffic patterns (business hours, sequential transactions).
default_pool_size = 10

; Total client connections PgBouncer accepts (PHP-FPM + scheduler + workers + headroom).
max_client_conn = 100

; Keep 2 server connections warm per pool even when idle (avoids cold-connect latency).
min_pool_size = 2

; Release idle server connections after 60s. Keeps Postgres connection count low
; when tenants are inactive (nights/weekends).
server_idle_timeout = 60

; Kill a client waiting more than 30s for a slot (prevents request pile-up).
client_login_timeout = 30

;; PHP/pdo_pgsql sends extra_float_digits=3 in the startup packet.
;; Without this line, every PHP connection attempt fails with:
;;   ERROR: unsupported startup parameter: extra_float_digits
;; application_name is also sent by some Laravel DB managers.
ignore_startup_parameters = extra_float_digits,application_name

;; Logging (verbose in dev)
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

;; Admin console access (connect to database "pgbouncer" to run SHOW POOLS etc.)
admin_users = postgres
stats_users = postgres

pidfile = /tmp/pgbouncer.pid
